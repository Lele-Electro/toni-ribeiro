<section class="hero" aria-label="Toni Ribeiro">
  <!-- Layered diagonal greens behind everything; purely decorative. -->
  <div class="hero-layers" aria-hidden="true"></div>

  <div class="hero-brand">
    <h1 class="hero-brand__name">Toni <br />Ribeiro</h1>
    <p class="hero-brand__line">Tailored Services</p>
    <a class="hero-brand__linkedin" [href]="linkedInUrl" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect class="hero-brand__linkedin-badge" x="1" y="1" width="22" height="22" rx="4" />
        <g class="hero-brand__linkedin-mark">
          <circle cx="7.2" cy="7.1" r="1.6" />
          <rect x="5.8" y="9.4" width="2.8" height="8.8" />
          <path
            d="M10.6 9.4h2.7v1.3c.5-.9 1.6-1.5 3-1.5 2.4 0 3.4 1.5 3.4 4.1v4.9h-2.8v-4.4c0-1.2-.4-2-1.5-2s-2 .8-2 2.1v4.3h-2.8z"
          />
        </g>
      </svg>
      <span>LinkedIn</span><span class="sr-only"> (opens in a new tab)</span>
    </a>
  </div>

  <!-- White on the phone layout's green; the original green on the desktop's white. -->
  <picture class="hero-joburg">
    <source media="(max-width: 40rem)" srcset="i-love-joburg%20copy-white.png" />
    <img src="i-love-joburg.png" alt="I love Joburg" width="282" height="335" />
  </picture>

  <div class="parallogram-background">
    <app-navbar class="landing-navbar" />
    <img
      class="landing-portrait"
      src="toni-home-page.webp"
      alt="Toni Ribeiro"
      width="1452"
      height="1456"
      fetchpriority="high"
    />
  </div>

  <figure class="hero-video" [class.is-playing]="playing()">
    <video
      #video
      class="hero-video__media"
      playsinline
      preload="none"
      poster="create-1-poster.webp"
      width="1372"
      height="760"
      aria-label="Toni Ribeiro introduces himself"
      [controls]="started()"
      (play)="playing.set(true)"
      (pause)="playing.set(false)"
      (ended)="playing.set(false)"
    >
      <source
        media="(max-width: 40rem)"
        src="create-1-mobile.webm"
        type='video/webm; codecs="vp9, opus"'
      />
      <source media="(max-width: 40rem)" src="create-1-mobile.mp4" type="video/mp4" />
      <source src="create-1.webm" type='video/webm; codecs="vp9, opus"' />
      <source src="create-1.mp4" type="video/mp4" />
    </video>
    @if (!playing()) {
      <button
        type="button"
        class="hero-video__play"
        animate.enter="fade-enter"
        [attr.aria-label]="started() ? 'Resume video' : 'Play video: Toni introduces himself'"
        (click)="play()"
      >
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z" fill="currentColor" />
        </svg>
      </button>
    }
  </figure>
</section>
<div class="bottom" role="region" aria-label="Services (focus to pause scrolling)" tabindex="0">
  <div class="roles-track">
    @for (copy of [0, 1]; track copy) {
      <ul class="roles-group" [attr.aria-hidden]="copy === 1 ? 'true' : null">
        @for (role of roles; track $index) {
          <li>{{ role }}</li>
        }
      </ul>
    }
  </div>
</div>
