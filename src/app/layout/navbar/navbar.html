<app-mobile-menu
  [appearance]="appearance()"
  [authenticated]="hydrated() && auth.isAuthenticated()"
  (logout)="logout()"
/>
<nav
  class="navbar"
  [class.navbar--frosted]="appearance() === 'frosted'"
  [class.navbar--compact]="compact()"
  aria-label="Main navigation"
>
  <ul class="navbar__links">
    <li>
      <a
        class="navbar__link"
        routerLink="/"
        [class.is-active]="activeSection() === 'home'"
        [attr.aria-current]="activeSection() === 'home' ? 'page' : null"
        >Home</a
      >
    </li>
    <li>
      <a
        class="navbar__link"
        routerLink="/lift-club"
        [class.is-active]="activeSection() === 'lift-club'"
        [attr.aria-current]="activeSection() === 'lift-club' ? 'page' : null"
        >Private Lift Club</a
      >
    </li>
    <li class="navbar__other">
      <button
        #otherToggle
        class="navbar__link"
        type="button"
        [class.is-active]="activeSection() === 'other'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="other-navigation"
        (click)="toggleMenu()"
      >
        Other
      </button>
      <ul
        id="other-navigation"
        class="navbar__dropdown"
        [hidden]="!menuOpen()"
        aria-label="Other pages"
      >
        <li>
          <a
            routerLink="/referral-business"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            >Referral Business</a
          >
        </li>
        <li>
          <a routerLink="/schedule" routerLinkActive="is-active" ariaCurrentWhenActive="page"
            >My Schedule</a
          >
        </li>
        <li>
          <a routerLink="/privacy" routerLinkActive="is-active" ariaCurrentWhenActive="page"
            >Privacy Policy</a
          >
        </li>
        <li>
          <a routerLink="/terms" routerLinkActive="is-active" ariaCurrentWhenActive="page"
            >Terms of Service</a
          >
        </li>
      </ul>
    </li>
    <li>
      <a
        class="navbar__link"
        routerLink="/schedule"
        [queryParams]="{ service: 'general' }"
        [class.is-active]="activeSection() === 'contact'"
        [attr.aria-current]="activeSection() === 'contact' ? 'page' : null"
        >Contact</a
      >
    </li>
    <li class="navbar__account">
      @if (hydrated() && auth.isAuthenticated()) {
        <button class="navbar__link navbar__auth" type="button" (click)="logout()">Log out</button>
      } @else {
        <a
          class="navbar__link navbar__auth"
          routerLink="/login"
          [class.is-active]="activeSection() === 'account'"
          [attr.aria-current]="activeSection() === 'account' ? 'page' : null"
          >Log in</a
        >
      }
    </li>
  </ul>
</nav>
